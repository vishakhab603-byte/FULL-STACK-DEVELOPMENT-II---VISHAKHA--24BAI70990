spring.datasource.url=${DB_URL:jdbc:h2:file:./data/experiment-7;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_ACCESS_TTL_MS:900000}
refresh.expiration-ms=${JWT_REFRESH_TTL_MS:604800000}
aes.secret=${AES_SECRET}
demo.admin.password=${DEMO_ADMIN_PASSWORD:}
demo.user.password=${DEMO_USER_PASSWORD:}
